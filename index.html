.grid td.lk{font-weight:bold}.grid td.rq{background:#ffe9a8;font-weight:bold}.grid tr.dh td{height:16px;font-size:11px;font-weight:bold}

.red{background:#fdd;color:#b00;font-weight:bold}.org{background:#ffe7c2}.sun{color:#c00}.sat{color:#1f5fbf}
.ck-list{max-height:40vh;overflow:auto;padding-left:18px;font-size:12px}.ck-list .err{color:#b00}.ck-list .warn{color:#a60}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{padding:6px 10px}.chips button.on{background:#2f5d8a;color:#fff}.offb{background:#eee}
.ck2{display:inline-flex;align-items:center;gap:4px;margin:3px 8px 3px 0}
.form{display:grid;gap:10px}.form label{display:flex;flex-direction:column;font-size:12px;color:#555}

.card{background:#fff;border-radius:8px;padding:8px;margin:8px 0;box-shadow:0 1px 2px #0001}

.req{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}.req label{display:flex;flex-direction:column;font-size:11px}
.sub{border-top:1px dashed #ccc;padding:6px 0}.small{font-size:12px}

.mb{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}

/* ===== 定数・初期データ ===== */
const LS_KEY='shiftMaker.public.v1';
const OFF_CODES=['休','希休','有給','特休','夏季','リフ','代休','休所'];
const KOUKYU=['休','希休'];
const WD='日月火水木金土';
const KINDS=[['mon','月'],['tue','火'],['wed','水'],['thu','木'],['fri','金'],['sat','土'],['sun','日'],['hol','祝']];
function D(id,name,color,req,subs,extra){return Object.assign({id,name,color,req,subs:subs||[],closedDow:[]},extra||{});}
function sub(code,req,note){return {code,req,note:note||''};}
function defaultDepts(){return JSON.parse(JSON.stringify(SEED_DEPTS));}
let _sid=0;
function S(kind,title,dept,o){_sid++;return Object.assign({id:'s'+_sid,name:'S'+String(_sid).padStart(2,'0'),kind,title,dept,subs:[],fixed:[],help:[],satOK:false,carry:0},o||{});}
function defaultStaff(){return JSON.parse(JSON.stringify(SEED_STAFF));}
function defaultMeetings(){return [
 {name:'業務会議',week:'2',dow:3,target:'施設長'},{name:'運営会議',week:'1',dow:3,target:'施設長'},
 {name:'連絡会議',week:'1',dow:4,target:'施設長'},{name:'施設長会議',week:'last',dow:4,target:'施設長'},
 {name:'ジョブ会議',week:'2',dow:3,target:'job'},{name:'ジョブ会議',week:'4',dow:3,target:'job'},
 {name:'塾会議',week:'3',dow:4,target:'juku'}];}
function defaultState(){const t=new Date();let y=t.getFullYear(),m=t.getMonth()+2;if(m>12){m=1;y++;}
 return {ver:1,corp:'',depts:defaultDepts(),staff:defaultStaff(),meetings:defaultMeetings(),
  rules:{maxRun:5,satCap:3,trials:40,closeNewYear:true,closeObon:true,closeGW:true},cur:{y,m},months:{}};}

/* ===== 状態 ===== */
let ST;
let LS_OK=true,MEM={};
function lsGet(k){try{return window.localStorage.getItem(k);}catch(e){LS_OK=false;return MEM[k]??null;}}
function lsSet(k,v){MEM[k]=v;try{window.localStorage.setItem(k,v);}catch(e){LS_OK=false;}}
function load(){let s=null;try{s=JSON.parse(lsGet(LS_KEY));}catch(e){}if(s&&s.ver===1){ST=s;}else ST=defaultState();try{window.localStorage.setItem(LS_KEY+'.t','1');window.localStorage.removeItem(LS_KEY+'.t');}catch(e){LS_OK=false;}}
function save(){try{lsSet(LS_KEY,JSON.stringify(ST));}catch(e){LS_OK=false;}if(!LS_OK){const b=document.getElementById('memband');if(b)b.style.display='block';}}
const key=(y,m)=>y+'-'+String(m).padStart(2,'0');
function monthObj(y,m){const k=key(y,m);if(!ST.months[k])ST.months[k]={closed:null,req:{},res:null};const o=ST.months[k];if(o.closed===null)o.closed=defaultClosed(y,m);return o;}
function dim(y,m){return new Date(y,m,0).getDate();}
function dowOf(y,m,d){return new Date(y,m-1,d).getDay();}
function holName(y,m,d){return HOL[key(y,m)+'-'+String(d).padStart(2,'0')]||null;}
function defaultClosed(y,m){const r=[],R=ST.rules;const n=dim(y,m);
 for(let d=1;d<=n;d++){
  if(R.closeNewYear&&((m===12&&d>=29)||(m===1&&d<=3)))r.push(d);
  if(R.closeObon&&m===8&&d>=13&&d<=16)r.push(d);
  if(R.closeGW&&m===5&&d>=3&&d<=6&&holName(y,m,d))r.push(d);}
 return r;}
function deptById(id){return ST.depts.find(x=>x.id===id);}
const KW=[['塾','juku'],['ジョブ','job'],['カフェ','cafe'],['キッチン','cafe'],['ソーセージ','sausage'],['キング','king'],['ふらっと','flat'],['地マネ','chimane'],['中A','seiho'],['中B','seiho'],['生ホ','seiho'],['ホ生','seiho'],['ホーム','seiho'],['GH','seiho'],['生活','seikatsu'],['送迎','seikatsu'],['生','seikatsu']];
function kwDept(c){for(const [k,id] of KW)if(c.includes(k)){const d=deptById(id);if(d)return d;}return null;}
function cellDept(v,s){if(!v||!isWork(v.c))return null;if(v.dp)return deptById(v.dp);return codeDept(v.c)||(s?deptById(s.dept):null);}
function codeDept(code){if(!code)return null;for(const d of ST.depts){if(d.name===code)return d;if(d.subs.some(s=>s.code===code))return d;}
 for(const d of ST.depts){if(code.startsWith(d.name))return d;}return kwDept(code);}
function isOff(c){return OFF_CODES.includes(c);}
function isWork(c){return !!c&&!isOff(c);}

/* ===== 日情報 ===== */
function dayInfos(y,m){const mo=monthObj(y,m),n=dim(y,m),a=[];
 for(let d=1;d<=n;d++){const w=dowOf(y,m,d),h=holName(y,m,d);const closed=mo.closed.includes(d);
  let kind=h&&w!==0?'hol':['sun','mon','tue','wed','thu','fri','sat'][w];a.push({d,w,h,closed,kind});}
 return a;}
function deptReq(dep,di){if(di.closed)return 0;if(dep.closedDow.includes(di.w))return 0;return +dep.req[di.kind]||0;}
function subReq(sb,dep,di){if(di.closed||dep.closedDow.includes(di.w))return 0;return +sb.req[di.kind]||0;}
function deptOpen(dep,di){return deptReq(dep,di)>0;}
function nthWeek(y,m,d){return Math.floor((d-1)/7)+1;}
function meetingDays(y,m){const n=dim(y,m),out={};
 for(const mt of ST.meetings){let ds=[];for(let d=1;d<=n;d++)if(dowOf(y,m,d)===+mt.dow)ds.push(d);
  let d=mt.week==='last'?ds[ds.length-1]:ds[+mt.week-1];if(!d)continue;
  // 休所日・祝日なら翌営業日へ
  const mo=monthObj(y,m);let g=0;while(d<=n&&(mo.closed.includes(d)||holName(y,m,d)||dowOf(y,m,d)===0||dowOf(y,m,d)===6)&&g<7){d++;g++;}
  if(d>n)continue;(out[d]=out[d]||[]).push(mt);}
 return out;}
function attends(s,mt){return (mt.target==='施設長'?s.title.includes('施設長'):s.dept===mt.target)||(s.meet||[]).includes(mt.name);}
function satCountTarget(y,m){return dayInfos(y,m).filter(x=>x.w===0||x.w===6).length;}
function prevCarry(y,m){let py=y,pm=m-1;if(pm<1){pm=12;py--;}const po=ST.months[key(py,pm)];const out={};
 for(const s of ST.staff){let c=+s.carry||0;if(po&&po.res&&po.res[s.id]){const n=dim(py,pm);let r=0;for(let d=n;d>=1;d--){const v=po.res[s.id][d];if(v&&isWork(v.c))r++;else break;}c=r;}out[s.id]=c;}
 return out;}

/* ===== 自動作成 ===== */
function rnd(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function labsOf(s,g){const L=s.lab||{};const a=(L[g]&&L[g].length?L[g]:(L.wd&&L.wd.length?L.wd:L.we))||[];return a.length?a:[{c:s.subs[0]||deptById(s.dept).name,w:1}];}
function primaryCode(s){return labsOf(s,'wd')[0].c;}
function pickW(a,R){const t=a.reduce((x,y)=>x+y.w,0);let r=R()*t;for(const x of a){r-=x.w;if(r<=0)return x;}return a[0];}
function generate(y,m){const t0=performance.now();let best=null;
 for(let t=0;t<ST.rules.trials;t++){const r=oneTrial(y,m,rnd(1234567+t*7919));const ck=checks(y,m,r);
  const sc=ck.err*1000+ck.warn*10+ck.balance;if(!best||sc<best.sc)best={sc,r,ck};if(best.ck.err===0&&best.ck.warn===0)break;}
 return {res:best.r,ck:best.ck,ms:Math.round(performance.now()-t0)};}
function oneTrial(y,m,R){
 const days=dayInfos(y,m),n=days.length,mo=monthObj(y,m),reqs=mo.req||{},mdays=meetingDays(y,m),T=satCountTarget(y,m),carry=prevCarry(y,m);
 const res={};const staff=ST.staff;
 const cnt=(depId,d)=>{let c=0;const dep=deptById(depId);for(const s of staff){const v=res[s.id][d];if(v&&isWork(v.c)&&cellDept(v,s)===dep)c++;}return c;};
 const surplus=(depId,d)=>{const dep=deptById(depId);return cnt(depId,d)-deptReq(dep,days[d-1]);};
 const attendDay=(s,d)=>(mdays[d]||[]).some(mt=>attends(s,mt));
 // 1 初期化
 for(const s of staff){res[s.id]={};const rq=reqs[s.id]||{};const dep=deptById(s.dept);
  for(const di of days){const d=di.d;
   if(rq[d]){res[s.id][d]={c:rq[d]==='出勤'?primaryCode(s):rq[d],n:'',lock:true};continue;}
   if(s.kind==='常勤'){
    if(di.closed&&di.w!==0&&di.w!==6)res[s.id][d]={c:'休所',n:''};
    else if(di.w===0)res[s.id][d]={c:'休',n:''};
    else if(di.w===6)res[s.id][d]={c:'休',n:''};
    else if(!deptOpen(dep,di)&&di.kind==='hol'){res[s.id][d]={c:'休所',n:''};}
    else if(dep.closedDow.includes(di.w))res[s.id][d]={c:'休',n:''}; // 部署定休(例:ふらっと月曜)
    else res[s.id][d]={c:primaryCode(s),n:''};
   }else{
    res[s.id][d]=(s.fixed.includes(di.w)&&deptOpen(dep,di))?{c:primaryCode(s),n:''}:{c:'',n:''};
   }}}
 // 2 土曜(常勤)
 const satC={};staff.forEach(s=>satC[s.id]=0);
 for(const di of days){if(di.w!==6||di.closed||di.h)continue;
  for(const dep of shuffle(ST.depts.slice(),R)){let need=deptReq(dep,di)-cnt(dep.id,di.d);if(need<=0)continue;
   const cands=shuffle(staff.filter(s=>s.kind==='常勤'&&s.satOK&&(s.dept===dep.id||s.help.includes(dep.id))&&!res[s.id][di.d].lock&&satC[s.id]<(s.satCap||ST.rules.satCap)),R)
    .sort((a,b)=>(a.dept===dep.id?0:1)-(b.dept===dep.id?0:1)||satC[a.id]/Math.max(a.satRate||0.3,0.2)-satC[b.id]/Math.max(b.satRate||0.3,0.2)||((b.helpW||{})[dep.id]||0)-((a.helpW||{})[dep.id]||0));
   for(const s of cands){if(need<=0)break;res[s.id][di.d]=s.dept===dep.id?{c:primaryCode(s),n:''}:{c:dep.name,n:'ヘルプ',dp:dep.id};satC[s.id]++;need--;}}}
 // 3 平日公休の配置(常勤)
 const offCount=s=>Object.values(res[s.id]).filter(v=>KOUKYU.includes(v.c)).length;
 const canRest=(s,d)=>{const v=res[s.id][d],di=days[d-1];return v&&!v.lock&&isWork(v.c)&&di.w!==6&&di.w!==0&&!attendDay(s,d);};
 const runAt=(s,d)=>{let a=0,b=0;for(let i=d-1;i>=1&&isWork(res[s.id][i].c);i--)a++;if(d-1-a<1)a+=carry[s.id];for(let i=d+1;i<=n&&isWork(res[s.id][i].c);i++)b++;return a+b+1;};
 const restScore=(s,d)=>{const v=res[s.id][d];const dep=cellDept(v,s)||deptById(s.dept);return surplus(dep.id,days[d-1].d)*3+Math.min(runAt(s,d),9)+((s.restW||[])[days[d-1].w]||0)*6+R()*1.5;};
 for(const s of shuffle(staff.filter(s=>s.kind==='常勤'),R)){
  // 土曜出勤の代休(同週の平日)
  for(const di of days){if(di.w!==6||!isWork(res[s.id][di.d].c)||offCount(s)>=T)continue;
   let c=[];for(let d=di.d-5;d<di.d;d++)if(d>=1&&canRest(s,d))c.push(d);
   if(!c.length)for(let d=di.d+2;d<=Math.min(n,di.d+6);d++)if(canRest(s,d))c.push(d);
   if(c.length){const cw=x=>((s.compW||[])[days[x-1].w]||0)*6;c.sort((a,b)=>restScore(s,b)+cw(b)-restScore(s,a)-cw(a));res[s.id][c[0]]={c:'休',n:''};}}
  let need=T-offCount(s),g=0;
  while(need>0&&g++<40){const c=[];for(let d=1;d<=n;d++)if(canRest(s,d))c.push(d);if(!c.length)break;
   c.sort((a,b)=>restScore(s,b)-restScore(s,a));res[s.id][c[0]]={c:'休',n:''};need--;}
  // 多すぎる場合(土曜を休にしている等)→ 休を出勤に戻す(平日の非ロック)
  g=0;while(offCount(s)>T&&g++<40){const c=[];for(let d=1;d<=n;d++){const v=res[s.id][d],di=days[d-1];if(v.c==='休'&&!v.lock&&di.w!==0&&di.w!==6&&!deptById(s.dept).closedDow.includes(di.w))c.push(d);}if(!c.length)break;res[s.id][c[Math.floor(R()*c.length)]]={c:primaryCode(s),n:''};}
 }
 // 4 連勤修正(休の移動)
 for(let it=0;it<3;it++)for(const s of staff.filter(s=>s.kind==='常勤')){
  for(let d=1;d<=n;d++){if(!isWork(res[s.id][d].c))continue;if(runAt(s,d)<=ST.rules.maxRun)continue;
   // 連続区間を求め中央付近に休を入れ、他の休を出勤へ
   let a=d;while(a>1&&isWork(res[s.id][a-1].c))a--;let b=d;while(b<n&&isWork(res[s.id][b+1].c))b++;
   const ins=[];for(let x=a;x<=b;x++)if(canRest(s,x))ins.push(x);if(!ins.length)continue;
   ins.sort((p,q)=>Math.abs((p-a)-(b-p))-Math.abs((q-a)-(b-q))||restScore(s,q)-restScore(s,p));
   const x=ins[0];const outs=[];for(let z=1;z<=n;z++){const v=res[s.id][z],di=days[z-1];if(v.c==='休'&&!v.lock&&di.w>=1&&di.w<=5&&(z<a-1||z>b+1))outs.push(z);}
   let done=false;
   for(const z of shuffle(outs,R)){res[s.id][x]={c:'休',n:''};res[s.id][z]={c:primaryCode(s),n:''};
    if(runAt(s,z)<=ST.rules.maxRun){done=true;break;}res[s.id][z]={c:'休',n:''};res[s.id][x]={c:primaryCode(s),n:''};}
   if(done)d=b;}}
 // 5 人数不足の修正(ヘルプ / 休の交換)
 for(const di of days){const d=di.d;if(di.closed||di.w===0)continue;
  for(const dep of ST.depts){let need=deptReq(dep,di)-cnt(dep.id,d);if(need<=0)continue;
   // 休の入替(同部署の常勤で別日に余裕がある)
   for(const s of shuffle(staff.filter(s=>s.kind==='常勤'&&s.dept===dep.id&&res[s.id][d].c==='休'&&!res[s.id][d].lock&&di.w!==6),R)){if(need<=0)break;
    let ok=false;for(let z=1;z<=n&&!ok;z++){if(z===d||!canRest(s,z))continue;if(surplus(dep.id,z)<=0)continue;
     res[s.id][d]={c:primaryCode(s),n:''};res[s.id][z]={c:'休',n:''};
     if(runAt(s,d)<=ST.rules.maxRun&&runAt(s,Math.max(1,z-1))<=ST.rules.maxRun&&runAt(s,Math.min(n,z+1))<=ST.rules.maxRun){ok=true;need--;}
     else{res[s.id][d]={c:'休',n:''};res[s.id][z]={c:primaryCode(s),n:''};}}}
   // ヘルプ
   for(const s of shuffle(staff.filter(s=>s.help.includes(dep.id)),R).sort((a,b)=>((b.helpW||{})[dep.id]||0)-((a.helpW||{})[dep.id]||0))){if(need<=0)break;const v=res[s.id][d];if(!isWork(v.c)||v.lock)continue;
    const hd=cellDept(v,s);if(!hd||hd.id===dep.id)continue;if(surplus(hd.id,d)<=0)continue;res[s.id][d]={c:dep.name,n:'ヘルプ',dp:dep.id};need--;}}}
 // 6 サブ区分・個人の表記(実績傾向で重み付け)
 const N=x=>x.replace(/[Ａ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
 for(const di of days){const d=di.d,g=(di.w===0||di.w===6||di.h)?'we':'wd';for(const dep of ST.depts){
  const ws=staff.filter(s=>{const v=res[s.id][d];return isWork(v.c)&&!v.lock&&s.dept===dep.id&&cellDept(v,s)===dep&&v.n!=='ヘルプ';});
  const used=new Set();
  for(const sb of dep.subs){let need=subReq(sb,dep,di);if(need<=0)continue;
   const el=[];for(const s of ws){if(used.has(s.id))continue;const all=labsOf(s,g).concat(labsOf(s,g==='wd'?'we':'wd'));const l=all.find(x=>N(x.c).includes(sb.code));if(l||s.subs.includes(sb.code))el.push([s,l?l.c:sb.code,(l?l.w:0.05)+R()*0.2]);}
   el.sort((p,q)=>q[2]-p[2]);for(const [s,c] of el){if(need<=0)break;res[s.id][d].c=c;res[s.id][d].dp=dep.id;used.add(s.id);need--;}}
  for(const s of ws)if(!used.has(s.id)){const L=labsOf(s,g).filter(x=>{const sb=dep.subs.find(q=>N(x.c).includes(q.code));return !sb||subReq(sb,dep,di)>0;});const pick=L.length?pickW(L,R):labsOf(s,g)[0];res[s.id][d].c=pick.c;res[s.id][d].dp=dep.id;}
 }}
 // 7 会議注記
 for(const d in mdays)for(const s of staff){const v=res[s.id][d];const ms=mdays[d].filter(mt=>attends(s,mt));if(ms.length&&isWork(v.c))v.n=ms.map(x=>x.name).join('・');}
 return res;}

/* ===== チェック ===== */
function checks(y,m,res){const days=dayInfos(y,m),n=days.length,T=satCountTarget(y,m),carry=prevCarry(y,m),mdays=meetingDays(y,m);
 const list=[];let err=0,warn=0;const E=(msg,sid,d)=>{list.push({lv:'err',msg,sid,d});err++;};const W=(msg,sid,d)=>{list.push({lv:'warn',msg,sid,d});warn++;};
 const per={};const sats=[];
 for(const s of ST.staff){const r=res[s.id];if(!r)continue;let off=0,yu=0,work=0,run=carry[s.id],mx=run,sat=0;
  for(const di of days){const v=r[di.d]||{c:''};if(KOUKYU.includes(v.c))off++;if(['有給','特休','夏季','リフ','代休'].includes(v.c))yu++;
   if(isWork(v.c)){work++;run++;if(run>mx)mx=run;if(di.w===6)sat++;
    if(run===ST.rules.maxRun+1)W(`${s.name}: ${ST.rules.maxRun+1}連勤`,s.id,di.d);
    if(run===ST.rules.maxRun+2)E(`${s.name}: ${ST.rules.maxRun+2}連勤以上(禁止)`,s.id,di.d);
    if(s.kind==='常勤'&&di.w===0)E(`${s.name}: 日曜出勤`,s.id,di.d);
    if(s.kind==='非常勤'&&!s.fixed.includes(di.w)&&!v.lock)W(`${s.name}: 固定曜日外の出勤`,s.id,di.d);
    if(di.closed)W(`${s.name}: 休所日に出勤`,s.id,di.d);
   }else run=0;}
  if(s.kind==='常勤'){const lk=days.filter(di=>{const v=r[di.d]||{};return v.lock&&KOUKYU.includes(v.c)&&di.w>=1&&di.w<=6;}).length;if(off<T||(off>T&&off-lk>T))E(`${s.name}: 公休 ${off}/${T}日`,s.id,null);else if(off>T)W(`${s.name}: 公休 ${off}/${T}日（希休入力により超過）`,s.id,null);if(s.satOK)sats.push(sat);if(sat>(s.satCap||ST.rules.satCap))W(`${s.name}: 土曜出勤 ${sat}回(上限${s.satCap||ST.rules.satCap})`,s.id,null);}
  per[s.id]={off,yu,work,mx,sat};}
 const daily={};
 for(const di of days){const d=di.d;daily[d]={};
  for(const dep of ST.depts){let c=0;const sc={};for(const s of ST.staff){const v=(res[s.id]||{})[d];if(v&&isWork(v.c)&&cellDept(v,s)===dep){c++;const sb=dep.subs.find(q=>String(v.c).replace(/[Ａ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).includes(q.code));if(sb)sc[sb.code]=(sc[sb.code]||0)+1;}}
   const rq=deptReq(dep,di);daily[d][dep.id]={c,rq};
   if(c<rq)E(`${d}日 ${dep.name}: ${c}/${rq}人 不足`,null,d);
   if(rq===0&&c>0&&!di.closed&&di.w===6)W(`${d}日(土) ${dep.name}: 土曜対象外部署に出勤`,null,d);
   for(const sb of dep.subs){const q=subReq(sb,dep,di);if(q>0&&(sc[sb.code]||0)<q)W(`${d}日 ${sb.code}: ${sc[sb.code]||0}/${q}人`,null,d);}}
  for(const mt of (mdays[d]||[]))for(const s of ST.staff)if(attends(s,mt)&&res[s.id]&&!isWork((res[s.id][d]||{}).c)&&mt.target==='施設長')W(`${d}日 ${mt.name}: ${s.name}が不在`,s.id,d);
 }
 const mean=sats.reduce((a,b)=>a+b,0)/(sats.length||1);const balance=sats.reduce((a,b)=>a+(b-mean)**2,0);
 return {err,warn,list,per,daily,balance,T};}

/* ===== UI ===== */

 let h=monthBar()+`<div class="acts"><button class="pri" onclick="runGen()">⚙ 自動作成</button><button onclick="exportXlsx()">Excel出力</button></div><div class="acts">${printOpts()}${mo.res?'<button onclick="clearRes()">結果を消去</button>':''}</div>`;
 if(!mo.res)return h+`<p class="hint">「自動作成」を押すと、この月のシフトを作成します（希休などは「希望休」タブで先に入力）。</p>`;
 const ck=checks(y,m,mo.res);
 h+=`<div class="ck ${ck.err?'bad':ck.warn?'mid':'good'}">必須違反 <b>${ck.err}</b> ／ 警告 <b>${ck.warn}</b>（公休目標 ${ck.T}日） <a href="#" onclick="setTab('sum');return false">詳細</a></div>`;

 h+=`<div class="tw"><table class="grid"><thead><tr><th class="nm">名前</th>${days.map(di=>`<th class="${di.w===0?'sun':di.w===6?'sat':''}${di.h?' hol':''}${di.closed?' cl':''}">${di.d}<br><small>${WD[di.w]}${di.h?'祝':''}</small></th>`).join('')}</tr></thead><tbody>`;
 let lastDep=null;
 for(const s of staffOrdered()){const dep=deptById(s.dept);if(dep!==lastDep){lastDep=dep;h+=`<tr class="dh"><td class="nm" style="background:${dep?dep.color:'#eee'}">${esc(dep?dep.name:'未所属')}</td><td colspan="${days.length}" style="background:${dep?dep.color:'#eee'}"></td></tr>`;}

   h+=`<td class="c ${isOff(v.c)?'off':''} ${b||''} ${v.lock?'lk':''}" style="${isWork(v.c)?'background:'+((cellDept(v,s)||{}).color||''):''}" onclick="editCell('${s.id}',${di.d})">${esc(c)}${v.n?`<i>${esc(v.n)}</i>`:''}</td>`;}
  h+='</tr>';}
 h+='</tbody></table></div><p class="hint">セルをタップで手修正（再作成時に残すか選べます）。赤枠=違反、橙枠=警告。</p>';
 return h;}
function manCount(mo){let k=0;if(mo.res)for(const sid in mo.res)for(const d in mo.res[sid])if(mo.res[sid][d]&&mo.res[sid][d].man)k++;return k;}
function runGen(){const mo=curMo();const k=manCount(mo);if(!k)return doGen(false);
 $('#modal').innerHTML=`<div class="mb"><h3>手動変更を上書きしますか？</h3><p>この月には手動で変更したセルが${k}か所あります。</p><div class="acts" style="flex-direction:column"><button class="pri" onclick="closeM();doGen(true)">手動変更を固定して残し、再作成</button><button class="danger" onclick="closeM();doGen(false)">上書きして再作成</button><button onclick="closeM()">キャンセル</button></div></div>`;$('#modal').classList.add('on');}
function doGen(keep){const{y,m}=ST.cur;const mo=curMo();const bak=JSON.parse(JSON.stringify(mo.req||{}));const man=[];
 if(keep&&mo.res){mo.req=mo.req||{};for(const sid in mo.res)for(const d in mo.res[sid]){const v=mo.res[sid][d];if(v&&v.man){man.push([sid,d,JSON.parse(JSON.stringify(v))]);(mo.req[sid]=mo.req[sid]||{})[d]=v.c;}}}
 let g;try{g=generate(y,m);}finally{mo.req=bak;}
 for(const [sid,d,v] of man)if(g.res[sid])g.res[sid][d]=v;
 mo.res=g.res;save();render();toast(`作成完了 ${g.ms}ms：違反${g.ck.err}／警告${g.ck.warn}`);}
function runGenOld(){const{y,m}=ST.cur;const mo=curMo();const g=generate(y,m);mo.res=g.res;save();render();toast(`作成完了 ${g.ms}ms：違反${g.ck.err}／警告${g.ck.warn}`);}

 return h;}

 <div class="acts"><button class="pri" onclick="saveStaff('${s.id}',${!!id})">保存</button>${id?`<button class="danger" onclick="delStaff('${s.id}')">削除</button>`:''}<button onclick="closeM()">閉じる</button></div></div>`;$('#modal').classList.add('on');}
function saveStaff(id,exists){let s=exists?ST.staff.find(x=>x.id===id):{id};const g=c=>[...document.querySelectorAll(c)].filter(x=>x.checked).map(x=>x.value);
 Object.assign(s,{name:$('#f_name').value.trim()||'未設定',kind:$('#f_kind').value,title:$('#f_title').value,dept:$('#f_dept').value,fixed:g('.f_fx').map(Number),subs:g('.f_sb'),help:g('.f_hp'),satOK:$('#f_sat').checked,satCap:+$('#f_satcap').value||0,carry:+$('#f_carry').value||0});
 if(!exists)ST.staff.push(s);save();closeM();render();}
function delStaff(id){if(!confirm('削除しますか？'))return;ST.staff=ST.staff.filter(s=>s.id!==id);save();closeM();render();}

/* --- データ --- */
function rData(){return `<h3>バックアップ</h3><p class="hint">データはこの端末のブラウザ内（localStorage）に保存。外部には送信しません。</p><div class="acts"><button class="pri" onclick="exportJson()">JSON書き出し</button><label class="btn">データ読み込み<input type="file" onchange="importJson(this)" hidden></label></div>
 <h3>初期化</h3><div class="acts"><button class="danger" onclick="if(confirm('全データを初期サンプルに戻します。よろしいですか？')){ST=defaultState();save();render();}">初期サンプルに戻す</button></div>
 <h3>このツールのルール（実績から推定）</h3><ul class="hint"><li>個人ごとの傾向（主な勤務表記と割合、土曜頻度、休みやすい曜日、土曜後の代休曜日、ヘルプ先、会議）を重みとして使用</li><li>常勤の公休＝その月の土日数（希休を含む）</li><li>連勤5日まで（6日は警告、7日以上は違反）</li><li>日曜は常勤休み（部署の日曜人数で非常勤のみ）</li><li>非常勤は固定曜日のみ</li><li>土曜は土曜人数が設定された部署のみ。常勤は上限内で均等に、代休は同じ週の平日</li><li>会議日は対象者を出勤に</li><li>ヘルプは登録された組合せのみ、不足時だけ</li></ul>`;}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportJson(){download('shift_backup_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(ST)],{type:'application/json'}));}
function importJson(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s.ver!==1)throw 0;const d=defaultState();ST=Object.assign(d,s,{cur:s.cur||d.cur});if(!Array.isArray(ST.depts)||!ST.depts.length)ST.depts=d.depts;save();render();toast(ST.staff.length+'人を読み込みました');alert(ST.staff.length+'人を読み込みました');}catch(e){alert('読み込めませんでした');}};r.readAsText(f);}

/* --- Excel --- */
function buildWorkbook(y,m){const mo=monthObj(y,m),res=mo.res,days=dayInfos(y,m),n=days.length;
 const ws={},merges=[];const A=(r,c)=>XLSX.utils.encode_cell({r,c});
 const bd={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
 const put=(r,c,v,st)=>{ws[A(r,c)]={v:v??'',t:'s',s:Object.assign({border:bd,alignment:{horizontal:'center',vertical:'center',wrapText:true},font:{sz:9}},st||{})};};
 const fy=m>=4?y:y-1;
 put(0,10,`令和　${fy-2018}年度　　${ST.corp}　　シフト表`,{border:{},font:{sz:14,bold:true},alignment:{horizontal:'left'}});put(0,33,m,{border:{},font:{sz:14,bold:true}});put(0,35,'月',{border:{},font:{sz:14,bold:true}});
 const blocks=[[1,Math.min(15,n)],[16,n]];let r0=1;const staff=staffOrdered();
 for(const [a,b] of blocks){put(r0,0,'常勤/非常勤');put(r0,1,'役職');put(r0,2,'日付');merges.push({s:{r:r0,c:2},e:{r:r0,c:5}});
  for(let c=3;c<=5;c++)put(r0,c,'');put(r0+1,0,'');put(r0+1,1,'');put(r0+1,2,'');merges.push({s:{r:r0+1,c:2},e:{r:r0+1,c:5}});
  for(let d=a;d<=b;d++){const c=6+3*(d-a),di=days[d-1];const col=di.w===0||di.h?'FFD9D9':di.w===6?'D9E7FF':'FFFFFF';
   put(r0,c,d+'日',{fill:{fgColor:{rgb:col}}});put(r0+1,c,WD[di.w]+(di.h?'祝':''),{fill:{fgColor:{rgb:col}}});for(let k=1;k<3;k++){put(r0,c+k,'');put(r0+1,c+k,'');}
   merges.push({s:{r:r0,c},e:{r:r0,c:c+2}},{s:{r:r0+1,c},e:{r:r0+1,c:c+2}});}
  let r=r0+2;
  for(const s of staff){const num=numbered(res,s,y,m);put(r,0,s.kind);put(r,1,s.title);put(r,2,s.name);put(r+1,0,'');put(r+1,1,'');for(let c=3;c<=5;c++){put(r,c,'');put(r+1,c,'');}put(r+1,2,'');
   merges.push({s:{r,c:0},e:{r:r+1,c:0}},{s:{r,c:1},e:{r:r+1,c:1}},{s:{r,c:2},e:{r:r+1,c:5}});
   for(let d=a;d<=b;d++){const c=6+3*(d-a),v=res[s.id][d]||{c:''};const dep=cellDept(v,s);const fill=dep?{fill:{fgColor:{rgb:dep.color.replace('#','').toUpperCase()}}}:{};
    put(r,c,num[d],Object.assign({font:{sz:9,color:{rgb:v.lock&&isOff(v.c)?'FF0000':'000000'}}},fill));put(r+1,c,v.n||'',Object.assign({font:{sz:8}},fill));
    for(let k=1;k<3;k++){put(r,c+k,'',fill);put(r+1,c+k,'',fill);}merges.push({s:{r,c},e:{r,c:c+2}},{s:{r:r+1,c},e:{r:r+1,c:c+2}});}
   r+=2;}
  r0=r+1;}
 ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:r0,c:6+3*15}});ws['!merges']=merges;
 ws['!cols']=[{wch:7},{wch:10},{wch:3},{wch:3},{wch:3},{wch:3}].concat(Array(48).fill({wch:3.2}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,m+'月');return wb;}
function exportXlsx(){const{y,m}=ST.cur;if(!curMo().res)return alert('先に自動作成してください');const wb=buildWorkbook(y,m);
 const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});const name=`シフト表_${y}年${m}月.xlsx`,blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});deliver(name,blob,y,m);}
async function deliver(name,blob,y,m){
 try{if(window.File&&navigator.canShare){const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return;}catch(e){if(e&&e.name==='AbortError')return;}}}}catch(e){}
 try{download(name,blob);return;}catch(e){}
 fallbackOut(blob,y,m);}
function toCSV(y,m){const res=curMo().res,n=dim(y,m);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['区分','役職','氏名'].concat(Array.from({length:n},(_,i)=>(i+1)+'日'))];
 for(const s of staffOrdered()){const num=numbered(res,s,y,m);rows.push([s.kind,s.title,s.name].concat(Array.from({length:n},(_,i)=>num[i+1])));}return rows.map(r=>r.map(q).join(',')).join('\n');}
function fallbackOut(blob,y,m){let url='';try{url=URL.createObjectURL(blob);}catch(e){}
 $('#modal').innerHTML=`<div class="mb"><h3>Excel出力</h3><p class="hint">自動で保存できませんでした。</p><div class="acts">${url?`<a class="btn" href="${url}" target="_blank" rel="noopener">新しいタブで開く</a>`:''}<button class="pri" onclick="copyCSV(${y},${m})">CSVをコピー</button><button onclick="closeM()">閉じる</button></div><textarea id="csvbox" style="width:100%;height:120px;display:none"></textarea></div>`;$('#modal').classList.add('on');}
async function copyCSV(y,m){const t=toCSV(y,m);try{await navigator.clipboard.writeText(t);toast('CSVをコピーしました');}catch(e){const a=$('#csvbox');a.style.display='block';a.value=t;a.select();try{document.execCommand('copy');toast('CSVをコピーしました');}catch(_){toast('表示されたCSVを長押ししてコピーしてください');}}}


function printOpts(){return `<select id="psel" style="padding:6px;font-size:14px"><option value="">全事業所（事業所ごとに改ページ）</option>${ST.depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button class="pri" onclick="doPrint($('#psel').value)">🖨 印刷</button>`;}
function buildPrint(y,m,only){const mo=curMo(),res=mo.res,days=dayInfos(y,m),n=days.length;
 const cls=di=>di.w===0||di.h?'sun':di.w===6?'sat':'';let H='';
 for(const dep of ST.depts){if(only&&dep.id!==only)continue;
  const home=ST.staff.filter(s=>s.dept===dep.id);const hp=ST.staff.filter(s=>s.dept!==dep.id&&res&&days.some(di=>{const v=res[s.id][di.d];return v&&cellDept(v,s)===dep;}));
  if(!home.length&&!hp.length)continue;const rows=home.length+hp.length;
  const pf=rows>24?'6pt':rows>18?'6.8pt':'7.5pt';
  H+=`<section class="pp" style="--pf:${pf};--pn:${pf};--rh:${Math.min(9,Math.floor(150/(rows+3)*10)/10)}mm"><h2>${ST.corp?esc(ST.corp)+'　':''}${esc(dep.name)}　${y}年${m}月 シフト表</h2><table><colgroup><col class="pn" style="width:26mm"><col style="width:9mm">${days.map(()=>'<col>').join('')}</colgroup>
  <tr><th class="pn" rowspan="2">氏名</th><th class="pk" rowspan="2">区分</th>${days.map(di=>`<th class="${cls(di)}">${di.d}</th>`).join('')}</tr>
  <tr>${days.map(di=>`<th class="${cls(di)}">${WD[di.w]}${di.h?'<br>祝':''}</th>`).join('')}</tr>`;
  const cnt=Array(n+1).fill(0);
  const row=(s,isHelp)=>{const num=res?numbered(res,s,y,m):{};let r=`<tr><td class="pn">${isHelp?'【応援】':''}${esc(s.name)}</td><td class="pk">${esc(s.kind==='常勤'?'常':'非')}</td>`;
   for(const di of days){const v=res?(res[s.id][di.d]||{c:''}):{c:''};const cd=cellDept(v,s);let t='',c='';
    if(isHelp){if(cd===dep){t='応'+(v.c===dep.name?'':v.c);c='hp';cnt[di.d]++;}else{c='ou';}}
    else if(isWork(v.c)){if(cd&&cd!==dep){t='→'+cd.name;c='ou';}else{t=num[di.d];cnt[di.d]++;if(v.n==='ヘルプ')c='hp';}}
    else{t=num[di.d]||'';c=v.c?'off':'';}
    r+=`<td class="${c}">${esc(t)}</td>`;}return r+'</tr>';};
  for(const s of home)H+=row(s,false);for(const s of hp)H+=row(s,true);
  H+=`<tr class="sum"><td class="pn" colspan="2">出勤人数</td>${days.map(di=>`<td>${cnt[di.d]}</td>`).join('')}</tr></table>
  <div class="lg">凡例：灰色・斜体＝休み（公休①②…／有給／希休など）　【応援】行・点線枠＝他事業所からの応援　→○○＝他事業所へ応援　青・下線＝土曜　赤・二重下線＝日曜・祝日</div></section>`;}
 return H||'<p>印刷する職員がいません</p>';}
function doPrint(only){const{y,m}=ST.cur;if(!curMo().res&&!confirm('まだ自動作成していません。空の表を印刷しますか？'))return;
 const pv=$('#printview');pv.innerHTML=buildPrint(y,m,only);document.body.classList.add('printing');
 const done=()=>{document.body.classList.remove('printing');pv.innerHTML='';window.removeEventListener('afterprint',done);};
 window.addEventListener('afterprint',done);setTimeout(()=>{try{window.print();}catch(e){showErr(e.message);}setTimeout(()=>{if(!matchMedia('print').matches)done();},1500);},60);}
/* 起動 */
function boot(){const nj=document.getElementById('nojs');if(nj)nj.style.display='none';
 setTimeout(()=>{try{load();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));setTab('shift');if(!LS_OK)document.getElementById('memband').style.display='block';}catch(e){showErr((e&&e.message||e)+(e&&e.stack?'\n'+e.stack:''));}},30);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
