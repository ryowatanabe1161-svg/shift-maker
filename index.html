function monthObj(y,m){const k=key(y,m);if(!ST.months[k])ST.months[k]={closed:null,req:{},res:null};const o=ST.months[k];if(o.closed===null)o.closed=defaultClosed(y,m);return o;}
function dim(y,m){return new Date(y,m,0).getDate();}
function dowOf(y,m,d){return new Date(y,m-1,d).getDay();}
function holName(y,m,d){return HOL[key(y,m)+'-'+String(d).padStart(2,'0')]||null;}
function defaultClosed(y,m){const r=[],R=ST.rules;const n=dim(y,m);
 for(let d=1;d<=n;d++){
  if(R.closeNewYear&&((m===12&&d>=29)||(m===1&&d<=3)))r.push(d);
  if(R.closeObon&&m===8&&d>=13&&d<=16)r.push(d);
  if(R.closeGW&&m===5&&d>=3&&d<=6&&holName(y,m,d))r.push(d);}
 return r;}
function deptById(id){return ST.depts.find(x=>x.id===id);}
const KW=[['塾','juku'],['ジョブ','job'],['カフェ','cafe'],['キッチン','cafe'],['ソーセージ','sausage'],['キング','king'],['ふらっと','flat'],['地マネ','chimane'],['中A','seiho'],['中B','seiho'],['生ホ','seiho'],['ホ生','seiho'],['ホーム','seiho'],['GH','seiho'],['生活','seikatsu'],['送迎','seikatsu'],['生','seikatsu']];
function kwDept(c){for(const [k,id] of KW)if(c.includes(k)){const d=deptById(id);if(d)return d;}return null;}
function cellDept(v,s){if(!v||!isWork(v.c)||AWAY.includes(v.c))return null;if(v.dp)return deptById(v.dp);return codeDept(v.c)||(s?deptById(s.dept):null);}
function codeDept(code){if(!code)return null;for(const d of ST.depts){if(d.name===code)return d;if(d.subs.some(s=>s.code===code))return d;}
 for(const d of ST.depts){if(code.startsWith(d.name))return d;}return kwDept(code);}
function isOff(c){return OFF_CODES.includes(c);}
function isWork(c){return !!c&&!isOff(c);}

/* ===== 日情報 ===== */
function dayInfos(y,m){const mo=monthObj(y,m),n=dim(y,m),a=[];
 for(let d=1;d<=n;d++){const w=dowOf(y,m,d),h=holName(y,m,d);const closed=mo.closed.includes(d);
  let kind=h&&w!==0?'hol':['sun','mon','tue','wed','thu','fri','sat'][w];a.push({d,w,h,closed,kind});}
 return a;}
function deptReq(dep,di){if(!dep||!di||di.closed)return 0;if(dep.closedDow.includes(di.w))return 0;return +dep.req[di.kind]||0;}
function subReq(sb,dep,di){if(di.closed||dep.closedDow.includes(di.w))return 0;return +sb.req[di.kind]||0;}
function deptOpen(dep,di){return deptReq(dep,di)>0;}
function nthWeek(y,m,d){return Math.floor((d-1)/7)+1;}
function meetingDays(y,m){const n=dim(y,m),out={};
 for(const mt of ST.meetings){let ds=[];for(let d=1;d<=n;d++)if(dowOf(y,m,d)===+mt.dow)ds.push(d);
  let d=mt.week==='last'?ds[ds.length-1]:ds[+mt.week-1];if(!d)continue;
  // 休所日・祝日なら翌営業日へ
  const mo=monthObj(y,m);let g=0;while(d<=n&&(mo.closed.includes(d)||holName(y,m,d)||dowOf(y,m,d)===0||dowOf(y,m,d)===6)&&g<7){d++;g++;}
  if(d>n)continue;(out[d]=out[d]||[]).push(mt);}
 return out;}
function attends(s,mt){return (mt.target==='施設長'?String(s.title||'').trim()==='施設長':s.dept===mt.target)||(s.meet||[]).includes(mt.name);}
function satCountTarget(y,m){return dayInfos(y,m).filter(x=>x.w===0||x.w===6).length;}
function prevCarry(y,m){let py=y,pm=m-1;if(pm<1){pm=12;py--;}const po=ST.months[key(py,pm)];const out={};
 for(const s of ST.staff){let c=+s.carry||0;if(po&&po.res&&po.res[s.id]){const n=dim(py,pm);let r=0;for(let d=n;d>=1;d--){const v=po.res[s.id][d];if(v&&isWork(v.c))r++;else break;}c=r;}out[s.id]=c;}
 return out;}

/* ===== 自動作成 ===== */
function rnd(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function labsOf(s,g){const L=s.lab||{};const a=(L[g]&&L[g].length?L[g]:(L.wd&&L.wd.length?L.wd:L.we))||[];return a.length?a:[{c:s.subs[0]||deptById(s.dept).name,w:1}];}
function primaryCode(s){return labsOf(s,'wd')[0].c;}
function pickW(a,R){const t=a.reduce((x,y)=>x+y.w,0);let r=R()*t;for(const x of a){r-=x.w;if(r<=0)return x;}return a[0];}
function generate(y,m){const t0=performance.now();let best=null;
 for(let t=0;t<ST.rules.trials;t++){const r=fixExtraOff(y,m,oneTrial(y,m,rnd(1234567+t*7919+GEN_SEED)));const ck=checks(y,m,r);
  const sc=ck.err*1000+ck.warn*10+ck.balance;if(!best||sc<best.sc)best={sc,r,ck};if(best.ck.err===0&&best.ck.warn===0)break;}
 return {res:best.r,ck:best.ck,ms:Math.round(performance.now()-t0)};}
function oneTrial(y,m,R){
 const days=dayInfos(y,m),n=days.length,mo=monthObj(y,m),reqs=mo.req||{},mdays=meetingDays(y,m),T=satCountTarget(y,m),carry=prevCarry(y,m);
 const res={};const staff=ST.staff;
 const cnt=(depId,d)=>{let c=0;const dep=deptById(depId);for(const s of staff){const v=res[s.id][d];if(v&&isWork(v.c)&&cellDept(v,s)===dep)c++;}return c;};
 const surplus=(depId,d)=>{const dep=deptById(depId);return cnt(depId,d)-deptReq(dep,days[d-1]);};
 const attendDay=(s,d)=>(mdays[d]||[]).some(mt=>attends(s,mt));
 // 1 初期化
 for(const s of staff){res[s.id]={};const rq=reqs[s.id]||{};const dep=deptById(s.dept);
  for(const di of days){const d=di.d;const dst=dayStat(s,y,m,d);if(dst){res[s.id][d]={c:dst==='out'?'対象外':'休職',n:dst==='leave'?leaveName(s,y,m,d):'',lock:true};continue;}
   if(rq[d]){res[s.id][d]={c:rq[d]==='出勤'?primaryCode(s):rq[d],n:'',lock:true};continue;}
   if(s.kind==='常勤'){
    if(di.closed&&di.w!==0&&(di.w!==6||(dep&&inclDow(dep)&&dep.closedDow.length)))res[s.id][d]={c:'休所',n:''};
    else if(di.w===0)res[s.id][d]={c:'休',n:''};
    else if(di.w===6)res[s.id][d]={c:'休',n:''};
    else if(!deptOpen(dep,di)&&di.kind==='hol'){res[s.id][d]={c:'休所',n:''};}
    else if(dep.closedDow.includes(di.w))res[s.id][d]={c:inclDow(dep)?'休':'定休',n:''}; // 部署定休(例:ふらっと月曜)
    else res[s.id][d]={c:primaryCode(s),n:''};
   }else{
    res[s.id][d]=(s.fixed.includes(di.w)&&deptOpen(dep,di))?{c:primaryCode(s),n:''}:{c:'',n:''};
   }}}
 for(const sid in (mo.furi||{}))if(res[sid])for(const sd in mo.furi[sid]){const z=mo.furi[sid][sd];if(res[sid][z]&&res[sid][z].c==='代休')res[sid][z].furiOf=+sd;}
 // 2 土曜(常勤)
 const satC={};staff.forEach(s=>satC[s.id]=0);
 for(const di of days){if(di.w!==6||di.closed||di.h)continue;
  for(const dep of shuffle(ST.depts.slice(),R)){let need=deptReq(dep,di)-cnt(dep.id,di.d);if(need<=0)continue;
   const cands=shuffle(staff.filter(s=>s.kind==='常勤'&&s.satOK&&(s.dept===dep.id||s.help.includes(dep.id))&&!res[s.id][di.d].lock&&satC[s.id]<satCapOf(s,days)),R)
    .sort((a,b)=>(a.dept===dep.id?0:1)-(b.dept===dep.id?0:1)||satC[a.id]/Math.max(a.satRate||0.3,0.2)-satC[b.id]/Math.max(b.satRate||0.3,0.2)||((b.helpW||{})[dep.id]||0)-((a.helpW||{})[dep.id]||0));
   for(const s of cands){if(need<=0)break;res[s.id][di.d]=s.dept===dep.id?{c:primaryCode(s),n:''}:{c:dep.name,n:'ヘルプ',dp:dep.id};satC[s.id]++;need--;}}}
 // 2b 前月末からの連勤：月初めの上限内に休みを確保
 for(const s of staff){const c=carry[s.id]||0;if(!c)continue;const k=Math.min(n,Math.max(1,ST.rules.maxRun-c+1));let has=false;for(let d=1;d<=k;d++)if(!isWork(res[s.id][d].c)){has=true;break;}if(has)continue;
  const cand=[];for(let d=1;d<=k;d++)if(!res[s.id][d].lock)cand.push(d);if(!cand.length)continue;cand.sort((p,q)=>restScore(s,q)-restScore(s,p));res[s.id][cand[0]]={c:s.kind==='常勤'?'休':'',n:'',lock:true,cr:1};}
 // 3 平日公休の配置(常勤)
 const offCount=s=>Object.values(res[s.id]).filter(v=>KOUKYU.includes(v.c)||(v.c==='代休'&&v.furiOf)).length;
 const canRest=(s,d)=>{const v=res[s.id][d],di=days[d-1];return v&&!v.lock&&isWork(v.c)&&di.w!==6&&di.w!==0&&!attendDay(s,d);};
 const runAt=(s,d)=>{let a=0,b=0;for(let i=d-1;i>=1&&isWork(res[s.id][i].c);i--)a++;if(d-1-a<1)a+=carry[s.id];for(let i=d+1;i<=n&&isWork(res[s.id][i].c);i++)b++;return a+b+1;};
 const restScore=(s,d)=>{const v=res[s.id][d];const dep=cellDept(v,s)||deptById(s.dept);return surplus(dep.id,days[d-1].d)*3+Math.min(runAt(s,d),9)+((s.restW||[])[days[d-1].w]||0)*6+R()*1.5;};
 for(const s of shuffle(staff.filter(s=>s.kind==='常勤'),R)){const Ts=koukyuT(s,y,m);
  // 土曜出勤の代休(同週の平日)
  for(const di of days){if(di.w!==6||!isWork(res[s.id][di.d].c)||offCount(s)>=Ts)continue;
   let c=[];for(let d=di.d-5;d<di.d;d++)if(d>=1&&canRest(s,d))c.push(d);
   if(!c.length)for(let d=di.d+2;d<=Math.min(n,di.d+6);d++)if(canRest(s,d))c.push(d);
   if(c.length){const cw=x=>((s.compW||[])[days[x-1].w]||0)*6;c.sort((a,b)=>restScore(s,b)+cw(b)-restScore(s,a)-cw(a));res[s.id][c[0]]={c:'休',n:''};}}
  let need=Ts-offCount(s),g=0;
  while(need>0&&g++<40){const c=[];for(let d=1;d<=n;d++)if(canRest(s,d))c.push(d);if(!c.length)break;
   c.sort((a,b)=>restScore(s,b)-restScore(s,a));res[s.id][c[0]]={c:'休',n:''};need--;}
  // 多すぎる場合(土曜を休にしている等)→ 休を出勤に戻す(平日の非ロック)
  g=0;while(offCount(s)>Ts&&g++<40){const c=[];for(let d=1;d<=n;d++){const v=res[s.id][d],di=days[d-1];if(v.c==='休'&&!v.lock&&di.w!==0&&di.w!==6&&!deptById(s.dept).closedDow.includes(di.w))c.push(d);}if(!c.length)break;res[s.id][c[Math.floor(R()*c.length)]]={c:primaryCode(s),n:''};}
 }
 // 4 連勤修正(休の移動)
 for(let it=0;it<3;it++)for(const s of staff.filter(s=>s.kind==='常勤')){
  for(let d=1;d<=n;d++){if(!isWork(res[s.id][d].c))continue;if(runAt(s,d)<=ST.rules.maxRun)continue;
   // 連続区間を求め中央付近に休を入れ、他の休を出勤へ
   let a=d;while(a>1&&isWork(res[s.id][a-1].c))a--;let b=d;while(b<n&&isWork(res[s.id][b+1].c))b++;
   const ins=[];for(let x=a;x<=b;x++)if(canRest(s,x))ins.push(x);if(!ins.length)continue;
   const cy=a===1?(carry[s.id]||0):0;ins.sort((p,q)=>Math.max(p-a+cy,b-p)-Math.max(q-a+cy,b-q)||restScore(s,q)-restScore(s,p));
   const x=ins[0];const outs=[];for(let z=1;z<=n;z++){const v=res[s.id][z],di=days[z-1];if(v.c==='休'&&!v.lock&&di.w>=1&&di.w<=5&&(z<a-1||z>b+1))outs.push(z);}
   let done=false;
   for(const z of shuffle(outs,R)){res[s.id][x]={c:'休',n:''};res[s.id][z]={c:primaryCode(s),n:''};
    if(runAt(s,z)<=ST.rules.maxRun){done=true;break;}res[s.id][z]={c:'休',n:''};res[s.id][x]={c:primaryCode(s),n:''};}
   if(done)d=b;}}
 // 5 人数不足の修正(ヘルプ / 休の交換)
 for(const di of days){const d=di.d;if(di.closed||di.w===0)continue;
  for(const dep of ST.depts){let need=deptReq(dep,di)-cnt(dep.id,d);if(need<=0)continue;
   // 休の入替(同部署の常勤で別日に余裕がある)
   for(const s of shuffle(staff.filter(s=>s.kind==='常勤'&&s.dept===dep.id&&res[s.id][d].c==='休'&&!res[s.id][d].lock&&di.w!==6),R)){if(need<=0)break;
    let ok=false;for(let z=1;z<=n&&!ok;z++){if(z===d||!canRest(s,z))continue;if(surplus(dep.id,z)<=0)continue;
     res[s.id][d]={c:primaryCode(s),n:''};res[s.id][z]={c:'休',n:''};
     if(runAt(s,d)<=ST.rules.maxRun&&runAt(s,Math.max(1,z-1))<=ST.rules.maxRun&&runAt(s,Math.min(n,z+1))<=ST.rules.maxRun){ok=true;need--;}
     else{res[s.id][d]={c:'休',n:''};res[s.id][z]={c:primaryCode(s),n:''};}}}
   // ヘルプ
   for(const s of shuffle(staff.filter(s=>s.help.includes(dep.id)),R).sort((a,b)=>((b.helpW||{})[dep.id]||0)-((a.helpW||{})[dep.id]||0))){if(need<=0)break;const v=res[s.id][d];if(!isWork(v.c)||v.lock)continue;
    const hd=cellDept(v,s);if(!hd||hd.id===dep.id)continue;if(surplus(hd.id,d)<=0)continue;res[s.id][d]={c:dep.name,n:'ヘルプ',dp:dep.id};need--;}}}
 fillQuals(y,m,res,days,R,canRest,runAt);
 // 6 サブ区分・個人の表記(実績傾向で重み付け)
 const N=x=>x.replace(/[Ａ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
 for(const di of days){const d=di.d,g=(di.w===0||di.w===6||di.h)?'we':'wd';for(const dep of ST.depts){
  const ws=staff.filter(s=>{const v=res[s.id][d];return isWork(v.c)&&!v.lock&&s.dept===dep.id&&cellDept(v,s)===dep&&v.n!=='ヘルプ';});
  const used=new Set();
  for(const sb of dep.subs){let need=subReq(sb,dep,di);if(need<=0)continue;
   const el=[];for(const s of ws){if(used.has(s.id))continue;const all=labsOf(s,g).concat(labsOf(s,g==='wd'?'we':'wd'));const l=all.find(x=>N(x.c).includes(sb.code));if(l||s.subs.includes(sb.code))el.push([s,l?l.c:sb.code,(l?l.w:0.05)+R()*0.2]);}
   el.sort((p,q)=>q[2]-p[2]);for(const [s,c] of el){if(need<=0)break;res[s.id][d].c=c;res[s.id][d].dp=dep.id;used.add(s.id);need--;}}
  for(const s of ws)if(!used.has(s.id)){const L=labsOf(s,g).filter(x=>{const sb=dep.subs.find(q=>N(x.c).includes(q.code));return !sb||subReq(sb,dep,di)>0;});const pick=L.length?pickW(L,R):labsOf(s,g)[0];res[s.id][d].c=pick.c;res[s.id][d].dp=dep.id;}
 }}
 // 7 会議注記
 for(const d in mdays)for(const s of staff){const v=res[s.id][d];const ms=mdays[d].filter(mt=>attends(s,mt));if(ms.length&&isWork(v.c))v.n=ms.map(x=>x.name).join('・');}
 for(const sid in res)for(const d in res[sid]){const v=res[sid][d];if(v&&v.cr){delete v.cr;delete v.lock;}}
 return res;}

/* ===== チェック ===== */
function checks(y,m,res){const days=dayInfos(y,m),n=days.length,T=satCountTarget(y,m),carry=prevCarry(y,m),mdays=meetingDays(y,m);
 const list=[];let err=0,warn=0;const E=(msg,sid,d)=>{list.push({lv:'err',msg,sid,d});err++;};const W=(msg,sid,d)=>{list.push({lv:'warn',msg,sid,d});warn++;};const I=(msg,sid,d)=>{list.push({lv:'info',msg,sid,d});};
 const per={};const sats=[];
 for(const s of ST.staff){const r=res[s.id];if(!r)continue;if(!empIn(s,y,m))continue;const Ts=koukyuT(s,y,m),fu=(monthObj(y,m).furi||{})[s.id]||{};let e7=0,off=0,yu=0,work=0,run=carry[s.id],mx=run,sat=0;
  for(const di of days){const v=r[di.d]||{c:''};if(KOUKYU.includes(v.c)||(v.c==='代休'&&v.furiOf))off++;if(['有給','特休','夏季','リフ','代休'].includes(v.c)&&!v.furiOf)yu++;
   if(isWork(v.c)){work++;run++;if(run>mx)mx=run;if(di.w===6)sat++;
    if(run===ST.rules.maxRun+1)W(`${s.name}: ${ST.rules.maxRun+1}連勤`,s.id,di.d);
    if(run>=ST.rules.maxRun+2&&!e7){E(`${s.name}: ${run}連勤（${ST.rules.maxRun+2}連勤以上は禁止）`,s.id,di.d);e7=1;}
    if(s.kind==='常勤'&&di.w===0){const z=fu[di.d];if(z&&(r[z]||{}).c==='代休')I(`${s.name}: ${di.d}日 日曜出勤（${z}日に振替の代休）`,s.id,di.d);else E(`${s.name}: 日曜出勤${z?'（振替の代休日が代休になっていません）':''}`,s.id,di.d);}
    if(s.kind==='非常勤'&&!s.fixed.includes(di.w)&&!v.lock)W(`${s.name}: 固定曜日外の出勤`,s.id,di.d);
    if(di.closed)W(`${s.name}: 休所日に出勤`,s.id,di.d);
   }else run=0;}
  if(s.kind==='常勤'){const lk=days.filter(di=>{const v=r[di.d]||{};return v.lock&&KOUKYU.includes(v.c)&&di.w>=1&&di.w<=6;}).length;if(Ts!==T&&off===Ts)I(`${s.name}: 公休目標 ${Ts}日（定休日・入退職・休職を反映。月の標準は${T}日）`,s.id,null);const cyx=(carry[s.id]||0)?(()=>{const k=Math.min(n,Math.max(1,ST.rules.maxRun-carry[s.id]+1));for(let d=1;d<=k;d++){const v=r[d]||{};if(!isWork(v.c))return KOUKYU.includes(v.c)&&days[d-1].w>=1&&days[d-1].w<=5?1:0;}return 0;})():0;
  if(off<Ts||(off>Ts&&off-lk-cyx>Ts))E(`${s.name}: 公休 ${off}/${Ts}日`,s.id,null);else if(off>Ts)I(`${s.name}: 公休 ${off}/${Ts}日（${cyx&&off-lk<=Ts+1&&off-lk>Ts?'前月末からの連勤のため月初めに休み':'希休入力'}により目標より多い）`,s.id,null);if(s.satOK)sats.push(sat);if(sat>satCapOf(s,days))W(`${s.name}: 土曜出勤 ${sat}回(上限${satCapOf(s,days)})`,s.id,null);}
  per[s.id]={off,yu,work,mx,sat};}
 const daily={};
 for(const di of days){const d=di.d;daily[d]={};
  for(const dep of ST.depts){let c=0;const sc={};for(const s of ST.staff){const v=(res[s.id]||{})[d];if(v&&isWork(v.c)&&cellDept(v,s)===dep){c++;const sb=dep.subs.find(q=>String(v.c).replace(/[Ａ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).includes(q.code));if(sb)sc[sb.code]=(sc[sb.code]||0)+1;}}
   const rq=deptReq(dep,di);daily[d][dep.id]={c,rq};
   if(c<rq)E(`${d}日 ${dep.name}: ${c}/${rq}人 不足`,null,d);
   if(rq===0&&c>0&&!di.closed&&di.w===6)W(`${d}日(土) ${dep.name}: 土曜対象外部署に出勤`,null,d);
   for(const sb of dep.subs){const q=subReq(sb,dep,di);if(q>0&&(sc[sb.code]||0)<q)W(`${d}日 ${sb.code}: ${sc[sb.code]||0}/${q}人 不足`,null,d);}
   for(const qr of (dep.qreq||[])){const q=(di.closed||dep.closedDow.includes(di.w))?0:(+qr.req[di.kind]||0);if(!q)continue;let qc=0;for(const s of ST.staff){const v=(res[s.id]||{})[d];if(v&&isWork(v.c)&&cellDept(v,s)===dep&&(s.quals||[]).includes(qr.q))qc++;}if(qc<q)E(`${d}日 ${dep.name}（${qr.q}）: ${qc}/${q}人 不足`,null,d);}}
  for(const mt of (mdays[d]||[]))for(const s of ST.staff)if(attends(s,mt)&&res[s.id]&&!isWork((res[s.id][d]||{}).c)&&!['休職','対象外'].includes((res[s.id][d]||{}).c)&&mt.target==='施設長')W(`${d}日 ${mt.name}: ${s.name}が不在`,s.id,d);
 }
 const mean=sats.reduce((a,b)=>a+b,0)/(sats.length||1);const balance=sats.reduce((a,b)=>a+(b-mean)**2,0);
 return {err,warn,list,per,daily,balance,T};}

 for(const s of ST.staff){if(s.kind!=='常勤'||!res[s.id])continue;const r=res[s.id];const dep=deptById(s.dept);if(!dep)continue;const Ts=koukyuT(s,y,m);
  let off=days.filter(di=>{const v=r[di.d]||{};return KOUKYU.includes(v.c)||(v.c==='代休'&&v.furiOf);}).length;let guard=0;
  while(off>Ts&&guard++<5){const cands=days.filter(di=>{const v=r[di.d];if(!v||v.c!=='休'||v.lock||di.w===0||di.closed||deptReq(dep,di)<=0)return false;
    if(di.w===6){if(!s.satOK)return false;const sc=days.filter(x=>x.w===6&&isWork((r[x.d]||{}).c)).length;if(sc>=satCapOf(s,days))return false;}
    const keep=JSON.stringify(v);r[di.d]={c:primaryCode(s),n:''};const ok=maxRunOf(res,s,y,m)<=ST.rules.maxRun;r[di.d]=JSON.parse(keep);return ok;});
   if(!cands.length)break;cands.sort((a,b)=>(dayCnt(res,dep,a.d)-deptReq(dep,a))-(dayCnt(res,dep,b.d)-deptReq(dep,b)));
   r[cands[0].d]={c:primaryCode(s),n:''};off--;}}
 return res;}
function fillQuals(y,m,res,days,R,canRest,runAt){const n=days.length,has=(s,q)=>(s.quals||[]).includes(q),MR=ST.rules.maxRun;
 const qc=(dep,q,d)=>ST.staff.filter(s=>{const v=res[s.id]&&res[s.id][d];return v&&isWork(v.c)&&cellDept(v,s)===dep&&has(s,q);}).length;
 const need=(dep,qr,di)=>(di.closed||dep.closedDow.includes(di.w))?0:(+qr.req[di.kind]||0);
 for(const dep of ST.depts)for(const qr of (dep.qreq||[]))for(const di of days){const d=di.d;let k=need(dep,qr,di)-qc(dep,qr.q,d);if(k<=0)continue;
  for(const s of shuffle(ST.staff.filter(s=>s.kind==='常勤'&&s.dept===dep.id&&has(s,qr.q)&&res[s.id][d].c==='休'&&!res[s.id][d].lock&&di.w!==0),R)){if(k<=0)break;
   if(di.w===6&&!s.satOK)continue;
   for(const z of shuffle(days.map(x=>x.d),R)){if(z===d||!canRest(s,z))continue;const dz=days[z-1],vz=res[s.id][z];if(cellDept(vz,s)!==dep)continue;
    if(qc(dep,qr.q,z)-1<need(dep,qr,dz)||dayCnt(res,dep,z)-1<deptReq(dep,dz))continue;
    const a=res[s.id][d],b=vz;res[s.id][d]={c:primaryCode(s),n:''};res[s.id][z]={c:'休',n:''};
    if(runAt(s,d)<=MR&&runAt(s,Math.max(1,z-1))<=MR&&runAt(s,Math.min(n,z+1))<=MR){k--;break;}res[s.id][d]=a;res[s.id][z]=b;}}
  for(const s of shuffle(ST.staff.filter(s=>has(s,qr.q)&&s.dept!==dep.id&&(s.help||[]).includes(dep.id)),R)){if(k<=0)break;const v=res[s.id][d];if(!v||!isWork(v.c)||v.lock)continue;const hd=cellDept(v,s);if(!hd||hd===dep)continue;
   if(dayCnt(res,hd,d)-1<deptReq(hd,di))continue;if((hd.qreq||[]).some(x=>has(s,x.q)&&qc(hd,x.q,d)-1<need(hd,x,di)))continue;res[s.id][d]={c:dep.name,n:'ヘルプ',dp:dep.id};k--;}}}
